apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vishal-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vishalvidhuri/GitOps-ArgoCD-HELM.git
    targetRevision: main
    path: deploy/vishal
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
