
name: Singapore AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::831926627575:role/GitHubActions-Singapore
          aws-region: ap-southeast-1

      - name: Verify AWS Account and Region
        run: |
          aws sts get-caller-identity
          aws configure get region || true
          echo "Singapore OIDC authentication successful"
