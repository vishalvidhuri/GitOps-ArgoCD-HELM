
name: Singapore AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::831926627575:role/GitHubActions-Singapore
          role-session-name: GitHubActions-Singapore-Test
          aws-region: ap-southeast-1
          audience: sts.amazonaws.com

      - name: Verify AWS Account and Region
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking AWS region..."
          aws configure get region

          echo "Singapore OIDC authentication successful!"
