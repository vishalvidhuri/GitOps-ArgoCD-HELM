
name: Test AWS OIDC and SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub repository context
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_REPOSITORY_ID: ${{ github.repository_id }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          echo "Repository: $GH_REPOSITORY"
          echo "Ref: $GH_REF"
          echo "Repository ID: $GH_REPOSITORY_ID"
          echo "Owner ID: $GH_OWNER_ID"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::834107150638:role/GitHubActions-EC2-Deploy
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Send test command to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0c404f37f9d6dda10 \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo OIDC_SSM_SUCCESS","hostname","date"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command
        shell: bash
        run: |
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0c404f37f9d6dda10 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0c404f37f9d6dda10 \
                --query '{Status:Status,Output:StandardOutputContent}' \
                --output json
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0c404f37f9d6dda10 \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM command"
          exit 1

