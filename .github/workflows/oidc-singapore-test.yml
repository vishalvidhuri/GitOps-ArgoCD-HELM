
name: Singapore AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::831926627575:role/GitHubActions-Singapore-New
          aws-region: ap-southeast-1
          role-session-name: GitHubActionsOIDCTest

      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity
          echo "Singapore AWS OIDC authentication successful"
