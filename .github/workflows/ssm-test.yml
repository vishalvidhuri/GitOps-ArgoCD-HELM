
name: GitOps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "deploy/**"
      - ".github/workflows/ssm-test.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: gitops-deployment-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-0c404f37f9d6dda10
      HELLO_TAG: "build-${{ github.run_number }}"
      VISHAL_TAG: "build-${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::834107150638:role/OIDCconnect
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build and import images on EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_COMMAND="HELLO_TAG='${HELLO_TAG}' VISHAL_TAG='${VISHAL_TAG}' /home/ubuntu/deploy-gitops.sh"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent}' \
                --output json
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for the EC2 SSM command."
          exit 1

      - name: Update Helm image tags
        shell: bash
        run: |
          set -euo pipefail

          sed -i -E \
            's/^([[:space:]]*tag:).*/\1 "'"${HELLO_TAG}"'"/' \
            deploy/hello/values.yaml

          sed -i -E \
            's/^([[:space:]]*tag:).*/\1 "'"${VISHAL_TAG}"'"/' \
            deploy/vishal/values.yaml

          echo "Updated Helm values:"
          grep -n 'tag:' deploy/hello/values.yaml
          grep -n 'tag:' deploy/vishal/values.yaml

      - name: Commit and push GitOps changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/hello/values.yaml deploy/vishal/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm changes to commit."
            exit 0
          fi

          git commit -m "chore(gitops): deploy ${HELLO_TAG}"
          git push origin HEAD:main

      - name: Verify Argo CD rollout on EC2
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_COMMAND="sudo kubectl rollout status deployment/hello-app -n default --timeout=120s && sudo kubectl rollout status deployment/vishal-app -n default --timeout=120s"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Rollout status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for rollout."
          exit 1
